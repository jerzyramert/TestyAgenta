[project]
name = "sailboat-weather-ingestion"
version = "0.1.0"
description = "Weather and spatial-data ingestion for the sailboat routing engine"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "cfgrib>=0.9.14",
    "dask[array]>=2024.1",
    "eccodes>=2.36",
    "fsspec>=2024.2",
    "geopandas>=1.0",
    "netCDF4>=1.6",
    "numcodecs>=0.12",
    "numpy>=1.26",
    "pyproj>=3.6",
    "pyogrio>=0.9",
    "psycopg[binary]>=3.2",
    "s3fs>=2024.2",
    "shapely>=2.0",
    "xarray>=2025.1",
    "zarr>=2.17",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "pytest>=8.0",
    "ruff>=0.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = [
    "fsspec",
    "fsspec.*",
    "geopandas",
    "geopandas.*",
    "shapely",
    "shapely.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
